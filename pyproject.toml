[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-navi"
version = "0.1.0"
description = "Frozen multimodal decision policies for auditable local navigation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10", "httpx>=0.27,<1", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
jev-navi = "jev_navi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
